[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phpscan"
version = "0.1.0"
description = "Analyseur statique pédagogique de motifs à risque dans du code PHP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayane Graïne" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "rich>=13"]

[project.optional-dependencies]
ast = ["tree-sitter>=0.22", "tree-sitter-php>=0.23"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
phpscan = "phpscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phpscan = ["../../rules/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
